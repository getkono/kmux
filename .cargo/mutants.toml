# cargo-mutants configuration for the kmux workspace — LIBRARY crates.
#
# cargo-mutants is pinned via mise (see mise.toml: `cargo:cargo-mutants`).
# Run with `mise run mutants`, or scope to one crate with
# `mise run mutants -- -p kmux-protocol`. The mise task picks the right config
# for each crate's target shape; this file is the default and covers the eleven
# crates that have a `lib` target.
#
# WHY THREE CONFIGS. cargo-mutants scopes the test phase to the mutated package
# (`cargo test --package=X ...`) and passes `additional_cargo_test_args` through
# verbatim. `--lib` HARD-ERRORS with "no library targets found" on a bin-only
# package, and cargo-mutants reads that non-zero exit as "the mutant was
# caught" — which is how the 2026-06-14 sweep reported a bogus 100% (712/0) for
# kmuxd and (608/0) for kmux-gtk while never testing a single mutant. The flags
# must therefore match the package's target shape:
#
#   .cargo/mutants.toml           `--lib`           the 11 crates with a lib target
#   .cargo/mutants-bin.toml       `--bins`          kmuxd, kmux-gtk
#   .cargo/mutants-bin-fast.toml  `--bins --tests`  kmux, kmux-vt-worker
#
# See docs/testing.md §Mutation testing.

# Library crates: mutate against the lib target's unit tests. `tests/` stays out
# — the only integration suite among these crates is kmux-client's
# grid_apply_worker.rs, a proptest whose cost per mutant is not worth its yield.
additional_cargo_test_args = ["--lib"]

# Mutant builds and tests can run slower than the clean baseline; give headroom
# so a slow — or deliberately hung — mutant is recorded as a timeout (= caught)
# rather than aborting the sweep.
timeout_multiplier = 5.0
minimum_test_timeout = 30

# Low-value files: raw C-ABI binding declarations carry no business logic worth
# mutating. (`**/mock.rs` used to be excluded here too; the only such file was
# kmux-pty's unused MockPty, now deleted.)
exclude_globs = ["crates/kmux-ghostty-sys/src/**"]

# `kmux daemon logs --server`'s entrypoint resolves a remote daemon, connects
# and authenticates before handing the stream to `stream_logs`, which is where
# the logic is and what the unit tests drive. With no daemon to reach, its
# body-replacement mutant can only be "missed". Recorded in docs/testing.md
# §Known exceptions.
exclude_re = [
    'crates/kmux-app/src/subcommands/daemon_cmd\.rs:.*replace fetch_remote_logs -> ',
    # `authenticate` only loads this user's real machine identity and calls
    # `authenticate_as`, which the unit tests drive over an in-memory stream
    # with a generated identity (issue #209).
    'crates/kmux-app/src/subcommands/mod\.rs:.*replace authenticate -> ',
    # `tail_local_log` only hands stdout to `tail_local_log_to`, which the
    # unit tests drive with a buffer; its `Ok(())` mutant is observable only
    # on the process's stdout (issue #207).
    'crates/kmux-app/src/subcommands/logs\.rs:.*replace tail_local_log -> ',
    # `run_daemon_command` is the `kmux daemon` dispatcher: each arm talks to
    # the real daemon of this profile and prints to stdout. `probe_takeover`
    # is the one probe of the real daemon a restart polls. The restart's
    # logic is `wait_for_takeover` / `report_takeover` / `stood_down`, unit-
    # tested with scripted probes (issue #207).
    'crates/kmux-app/src/subcommands/daemon_cmd\.rs:.*replace run_daemon_command -> ',
    'crates/kmux-app/src/subcommands/daemon_cmd\.rs:.* in probe_takeover',
    'crates/kmux-app/src/subcommands/daemon_cmd\.rs:.*replace probe_takeover -> ',
    # `query_handoff` only resolves this profile's control socket and calls
    # `query_handoff_at`, which is tested against a stand-in socket.
    'crates/kmux-connect/src/daemon/mod\.rs:.*replace query_handoff -> ',
    # `KmuxDriver::connection_banner` only locks the driver and converts
    # `FrontendDriver::connection_banner`, whose logic is unit-tested in
    # kmux-app; a `KmuxDriver` owns a runtime and bootstraps a daemon, so no
    # Rust test builds one — the registered kmux-ffi dispatch exception
    # (issue #208).
    'crates/kmux-ffi/src/driver\.rs:.*replace KmuxDriver::connection_banner -> ',
    # Likewise `KmuxDriver::sessions` only locks the driver and maps each entry
    # through `FfiSession::from_entry`, which is unit-tested (issue #208).
    'crates/kmux-ffi/src/driver\.rs:.*replace KmuxDriver::sessions -> ',
    # The live connection's drivers, each needing a real daemon or SSH peer
    # to reach (issue #209). `SessionManager::connect` runs the bootstrap
    # against its target and hands the outcome to `apply_outcome`;
    # `TransportSupervisor::run` loops over probes of real endpoints until its
    # caller hangs up; `launch_ssh_supervisor` and `run_supervisor_phase`
    # spawn that loop for an SSH link; `send_auth_frame` loads this user's real
    # identity and writes the frame. The decisions they make are unit-tested:
    # `apply_outcome` and `resume_from`, `ensure_active` and `probe_verdict`,
    # `auth_message`.
    'crates/kmux-client/src/session_manager/connection\.rs:.*replace SessionManager::connect -> ',
    'crates/kmux-connect/src/supervisor\.rs:.*replace TransportSupervisor::run with ',
    'crates/kmux-app/src/core/orchestration\.rs:.*replace AppCore::launch_ssh_supervisor with ',
    'crates/kmux-app/src/subcommands/dry_run\.rs:.*replace run_supervisor_phase -> ',
    'crates/kmux-connect/src/tcp_connect\.rs:.*replace send_auth_frame -> ',
]
