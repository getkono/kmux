# cargo-mutants configuration for the kmux workspace.
#
# cargo-mutants is pinned via mise (see mise.toml: `cargo:cargo-mutants`).
# Run the whole workspace with `just mutants`, or scope to one crate with
# `cargo mutants -p kmux-protocol`. Results land in `mutants.out/`.

# Mutant test runs use unit tests only (lib + bin targets), which skips the
# `tests/` integration suites — notably kmuxd's `handoff_e2e`, which spawns real
# daemon processes and is far too slow to run once per mutant.
#
# SCOPE LIMITATION — lib crates only. cargo-mutants scopes the test phase to the
# mutated package (`cargo test --package=X --lib --bins`), and `--lib` then
# HARD-ERRORS with "no library targets found" on the bin-only crates (kmuxd,
# kmux-gtk, kmux), which cargo-mutants misreads as "every mutant caught" (a bogus
# 100%). `--test-workspace` / `test_workspace` do NOT override the package
# scoping in cargo-mutants 27.1.0 (verified). So this config meaningfully scores
# only the LIB crates: kmux-protocol, kmux-client, kmux-app, kmux-ffi, kmux-pty.
# The bin-only crates are exercised by their unit suites under `just test`;
# mutation-scoring them needs a separate run that drops `--lib` (so no lib target
# is required) and tolerates the daemon e2e — tracked as a follow-up.
additional_cargo_test_args = ["--lib", "--bins"]

# Mutant builds and tests can run slower than the clean baseline; give headroom
# so a slow — or deliberately hung — mutant is recorded as a timeout (= caught)
# rather than aborting the sweep.
timeout_multiplier = 5.0
minimum_test_timeout = 30

# Low-value files: raw C-ABI binding declarations and test-only mock backends
# carry no business logic worth mutating.
exclude_globs = [
    "crates/kmux-ghostty-sys/src/**",
    "**/mock.rs",
]
