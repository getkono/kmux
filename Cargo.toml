[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
# Internal crates
kmux-pty = { path = "crates/kmux-pty" }
kmux-protocol = { path = "crates/kmux-protocol" }
kmux-client = { path = "crates/kmux-client" }

# External dependencies
anyhow = "1"
bitflags = "2"
clap = { version = "4", features = ["derive"] }
cli-clipboard = "0.4"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
iced = { version = "0.13", features = ["tokio", "canvas"] }
daemonize = "0.5"
nix = { version = "0.31", features = ["fs", "net", "process", "signal", "term", "user"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
quinn = "0.11"
rand = "0.9"
ratatui = "0.29"
rcgen = "0.13"
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive", "rc"] }
tattoy-wezterm-term = "0.1.0-fork.5"
tattoy-wezterm-surface = "0.1.0-fork.2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Dev dependencies
tempfile = "3"
tokio-test = "0.4"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "0.8"
