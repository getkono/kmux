[workspace]
# `crates/*` is the product surface mapped by docs/crate-usage.md. `xtask` is
# workspace tooling (the lint ratchet, the mutation gate, the dependency-direction
# assertions) and is listed separately so the glob above keeps meaning "the
# shipped crates" — see xtask/src/lib.rs.
members = ["crates/*", "xtask"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Justin Chung <noreply@justinchung.net>"]
license = "AGPL-3.0-only OR LicenseRef-Commercial"
repository = "https://github.com/getkono/kmux"
publish = false

[workspace.dependencies]
# Internal crates
kmux-pty = { path = "crates/kmux-pty" }
kmux-protocol = { path = "crates/kmux-protocol" }
# The client stack defaults to a lean, UDS-only build (no quinn/rustls/ssh): the
# `remote` feature (default-on when each crate is built standalone) is disabled
# here so GUI frontends inherit the lean stack and only `kmuxd` opts back in via
# its `federation` feature. See docs/architecture-federation.md.
kmux-connect = { path = "crates/kmux-connect", default-features = false }
kmux-client = { path = "crates/kmux-client", default-features = false }
kmux-ghostty-sys = { path = "crates/kmux-ghostty-sys" }
kmux-ghostty = { path = "crates/kmux-ghostty" }
# Shared server-side VT pipeline (terminal backend, diff engine, scrollback
# mirror). Depended on by kmuxd (in-process path) and the isolated
# kmux-vt-worker subprocess so both run identical diff code (issue #126). See
# docs/architecture-process-isolation.md.
kmux-vt-core = { path = "crates/kmux-vt-core" }
# Daemon<->worker IPC contract for process isolation (issue #126). Server-side
# only; GUI frontends never depend on it.
kmux-worker-protocol = { path = "crates/kmux-worker-protocol" }
kmux-app = { path = "crates/kmux-app", default-features = false }
# Shared GPU terminal renderer. Pulled only by the frontends' opt-in `gpu`
# feature (and, wgpu-free, by kmux-ffi for the packed-cell format); the default
# build stays lean. See docs/architecture-render.md.
kmux-render = { path = "crates/kmux-render", default-features = false }

# External dependencies
anyhow = "1"
base64 = "0.22"
bitflags = "2.11.1"
clap = { version = "4.6.1", features = ["derive", "unstable-ext"] }
# Dynamic shell completion engine (CompleteEnv + custom value completers). Both
# `unstable-dynamic` and clap's `unstable-ext` track clap's minor version, so
# keep this tilde-pinned in lockstep with clap (4.6.x). See docs/shell-completion.md.
clap_complete = { version = "~4.6", features = ["unstable-dynamic"] }
futures = "0.3"
daemonize = "0.5"
nix = { version = "0.31", features = ["fs", "net", "process", "signal", "socket", "term", "uio", "user"] }
serde_json = "1"
# Wire codec for the worker protocol and on-disk state (both are internally
# versioned and never cross a version boundary). The data-plane protocol uses
# named MessagePack instead — see docs/architecture-protocol-versioning.md.
postcard = { version = "1", features = ["alloc"] }
# Data-plane wire codec. Exact-pinned: the named-map encoding *is* the protocol,
# so an encoder change is a wire-format change, not a dependency update. Bump
# deliberately and re-check the fixture tests in kmux-protocol's codec module.
rmp-serde = "=1.3.1"
# `#[serde(with = "serde_bytes")]` on byte-slice fields: MessagePack encodes them
# as a `bin` blob instead of an array of integers (~1 byte/elem, not ~2).
serde_bytes = "0.11"
quinn = "0.11"
rand = "0.10.1"
# Lock-free Arc double-buffer for the off-UI-thread grid publish handoff (#182).
arc-swap = "1"
# Property testing for that handoff (dev-only).
proptest = "1"
rcgen = "0.14.7"
# Ed25519 sign/verify for cryptographic machine identity (issue #146). Already
# in the tree transitively via rustls; pinned to the resolved version. Pulled
# only by kmux-protocol's `identity` feature.
ring = "0.17"
sha2 = "0.11.0"
rustls = { version = "0.23.28", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive", "rc"] }
static_assertions = "1"
thiserror = "2"
tokio = { version = "1.52.1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "1.1.2"
tabled = "0.20.0"
# Cross-platform process stats (CPU/memory) for the process overview (issue
# #122). `default-features = false` drops the disk/network/component probes we
# never query. Server-side only (kmuxd).
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
# The `log` facade. kmux logs through `tracing`, not `log`; this is only so
# `init_logging` can cap tracing-subscriber's `tracing-log` bridge (see
# crates/kmux-app/src/launch.rs) and silence uniffi 0.28's per-FFI-call
# `log::debug!` scaffolding noise.
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uniffi = "0.28"
zstd = "0.13"

# GPU terminal rendering (kmux-render). Optional: only compiled when a frontend
# enables its `gpu` feature. swash/etagere/fontdb back the glyph atlas and font
# metrics. Versions verified to resolve on the pinned rust 1.96.0 toolchain.
wgpu = "29"
swash = "0.2"
etagere = "0.3"
fontdb = "0.23"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

# The GTK4 + libadwaita desktop stack (kmux-gtk). Target-gated by the member to
# Linux + macOS, where the system packages exist; the pins live here anyway so
# every external version has exactly one home. See docs/crate-usage.md.
gtk4 = "0.9"
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
pangocairo = "0.20"
# fontconfig, via pango. Used to register the bundled symbol fallback font at
# startup so Pango resolves Powerline/Nerd glyphs on the Cairo path (issue #145).
fontconfig-sys = { package = "yeslogic-fontconfig-sys", version = "6" }

# Dev dependencies
tempfile = "3"

# ── Lints ─────────────────────────────────────────────────────────────────────
# THE HARD GATE. Everything in these tables is at zero today, verified by a full
# `cargo clippy --workspace --all-targets` run, and must stay at zero. Members
# opt in with `[lints] workspace = true`.
#
# Levels are "warn", not "deny", on purpose: `mise run clippy` runs `-D warnings`
# and promotes every one of them to an error in the hooks and in CI, while a
# plain `cargo build` or rust-analyzer session stays readable.
#
# Lints that are NOT yet at zero are deliberately absent from this table. Putting
# one here at any level would break the tree immediately, because -D warnings
# makes "warn" fatal. They are instead injected by the lint gate as `-W` flags
# and ratcheted per crate against quality-baseline.toml. Graduating one is a
# two-line commit: drop it from the gate's list, add it here.
#
# Measured counts for the lints held back, so the next person does not have to
# re-measure: clippy::str_to_string 715, unused_qualifications 65,
# clippy::manual_let_else 18, trivial_casts 16, clippy::explicit_iter_loop 7,
# clippy::ptr_as_ptr 5, clippy::implicit_clone 3, clippy::verbose_file_reads 2,
# elided_lifetimes_in_paths 2.
[workspace.lints.rust]
# priority = -1 so the individual entries below can override the group; cargo
# sorts by priority, then emits the flags left to right.
future_incompatible = { level = "warn", priority = -1 }
# Homoglyph and bidi source attacks.
non_ascii_idents = "deny"
# An `#[expect(...)]` whose violation no longer exists must be deleted. This is
# what makes `#[allow]` -> `#[expect]` migration self-cleaning, and it is why
# AGENTS.md requires `#[expect]` for every new suppression.
unfulfilled_lint_expectations = "warn"
unused_must_use = "deny"
unused_extern_crates = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
# `all` is clippy's default set and is already the effective gate via
# `-D warnings`; stating it makes the baseline explicit rather than implied.
all = { level = "warn", priority = -1 }
# Manifest hygiene: every member already carries description/license/repository.
cargo = { level = "warn", priority = -1 }
# cargo-deny owns duplicate-version policy, with better diagnostics and an
# explicit skip list; clippy's version is a flat, unactionable wall.
multiple_crate_versions = "allow"

# Placeholders and debug residue.
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Numeric and pointer hygiene. This workspace hand-rolls a MessagePack field
# order and a C ABI, so a silent reinterpretation is a wire or FFI bug.
cast_ptr_alignment = "deny"
fn_to_numeric_cast_any = "deny"
lossy_float_literal = "deny"
rest_pat_in_fully_bound_structs = "warn"
inefficient_to_string = "warn"
