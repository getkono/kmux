[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Justin Chung <noreply@justinchung.net>"]
license = "LicenseRef-Proprietary"
repository = "https://github.com/getkono/kmux"
publish = false

[workspace.dependencies]
# Internal crates
kmux-pty = { path = "crates/kmux-pty" }
kmux-protocol = { path = "crates/kmux-protocol" }
kmux-client = { path = "crates/kmux-client" }
kmux-ghostty-sys = { path = "crates/kmux-ghostty-sys" }
kmux-ghostty = { path = "crates/kmux-ghostty" }
kmux-tui = { path = "crates/kmux-tui" }
kmux-app = { path = "crates/kmux-app" }

# External dependencies
anyhow = "1"
bitflags = "2.11.1"
clap = { version = "4.6.1", features = ["derive"] }
arboard = { version = "3", default-features = false }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3"
daemonize = "0.5"
nix = { version = "0.31", features = ["fs", "net", "process", "signal", "term", "user"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
quinn = "0.11"
rand = "0.10.1"
ratatui = "0.30.0"
rcgen = "0.14.7"
sha2 = "0.11.0"
rustls = { version = "0.23.28", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive", "rc"] }
static_assertions = "1"
thiserror = "2"
tokio = { version = "1.52.1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "1.1.2"
tabled = "0.20.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Dev dependencies
tempfile = "3"
tokio-test = "0.4"
