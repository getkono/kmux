[package]
name = "kmuxd"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "kmux server daemon hosting persistent terminal sessions."
build = "build.rs"

[[bin]]
name = "kmuxd"
path = "src/main.rs"

[dependencies]
kmux-pty.workspace = true
kmux-protocol = { workspace = true, features = ["framing", "tls", "quic", "tcp-tls", "uds"] }
daemonize.workspace = true
nix.workspace = true
serde.workspace = true
serde_json.workspace = true
kmux-ghostty.workspace = true
# Direct dep (rather than only transitive via kmux-ghostty) so this crate's
# build.rs receives `DEP_KMUX_GHOSTTY_LIB_DIR` and can embed the rpath.
kmux-ghostty-sys.workspace = true
tokio.workspace = true
quinn.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
rcgen.workspace = true
rand.workspace = true
clap.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
postcard.workspace = true

[dev-dependencies]
tempfile.workspace = true
