[package]
name = "kmuxd"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "kmux server daemon hosting persistent terminal sessions."
build = "build.rs"

[[bin]]
name = "kmuxd"
path = "src/main.rs"

[features]
# Daemon federation (issue #121): the local kmuxd opens an upstream connection
# to a remote kmuxd and proxies its sessions to local GUIs. Default-on for the
# daemon (it always wants the capability); gated so the federation subsystem and
# its `kmux-connect` dependency can be compiled out (`--no-default-features`),
# which also keeps the upstream-connect machinery off any build that doesn't
# need it. See docs/architecture-federation.md.
default = ["federation"]
# `kmux-connect/remote` re-enables the upstream transport stack (the workspace
# builds the client crates lean by default for the GUIs); the daemon federates
# to remote daemons over TCP+TLS and SSH, so it needs the full stack.
federation = ["dep:kmux-connect", "kmux-connect/remote"]

[dependencies]
kmux-pty.workspace = true
kmux-protocol = { workspace = true, features = [
    "framing",
    "tls",
    "quic",
    "tcp-tls",
    "uds",
    "identity",
] }
# Outbound peer links (the "server is also a client" role). Only pulled in with
# the `federation` feature; `kmux-connect` depends solely on `kmux-protocol`, so
# this adds no dependency cycle.
kmux-connect = { workspace = true, optional = true }
# The client-side `CellGrid` is reused as a pane mirror: federation mirrors a
# proxied remote pane, and process isolation (issue #126) mirrors an isolated
# worker's diff stream so the daemon can mint snapshots synchronously without an
# IPC round-trip. `kmux-client` depends on `kmux-protocol`, never on `kmuxd`, so
# no cycle. Lean (no remote transports) -- only the grid model is used.
# tests/handoff_e2e.rs reuses it to drive a real daemon's control + data sockets
# across a graceful restart, so it needs no separate dev-dependency entry.
kmux-client.workspace = true
# IPC contract for the isolated VT worker (issue #126).
kmux-worker-protocol.workspace = true
daemonize.workspace = true
nix.workspace = true
serde.workspace = true
serde_json.workspace = true
kmux-ghostty.workspace = true
# Direct dep (rather than only transitive via kmux-ghostty) so this crate's
# build.rs receives `DEP_KMUX_GHOSTTY_LIB_DIR` and can embed the rpath.
kmux-ghostty-sys.workspace = true
# Shared VT pipeline: `backend`, `diff_engine`, `term_state` re-exported at the
# crate root. Same code the isolated kmux-vt-worker runs (issue #126).
kmux-vt-core.workspace = true
tokio.workspace = true
quinn.workspace = true
rustls.workspace = true
rand.workspace = true
clap.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
postcard.workspace = true
# Cross-platform process stats (CPU/memory) for the process overview (issue
# #122). Used to sample each pane's process tree.
sysinfo.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Re-listed with `test-util` so kmuxd's relay/app unit tests can construct a
# `TermState` via `NullEventSink` (feature unification turns it on only for the
# test build, not the production daemon).
kmux-vt-core = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
