[package]
name = "kmuxd"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kmuxd"
path = "src/main.rs"

[features]
default = ["backend-wezterm"]
backend-wezterm = ["dep:tattoy-wezterm-term", "dep:tattoy-wezterm-surface"]
backend-ghostty = []

[dependencies]
kmux-pty.workspace = true
kmux-protocol = { workspace = true, features = ["framing", "tls", "quic", "tcp-tls", "uds"] }
daemonize.workspace = true
nix.workspace = true
serde.workspace = true
serde_json.workspace = true
tattoy-wezterm-term = { workspace = true, optional = true }
tattoy-wezterm-surface = { workspace = true, optional = true }
tokio.workspace = true
quinn.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
rcgen.workspace = true
rand.workspace = true
clap.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
postcard.workspace = true

[dev-dependencies]
tempfile.workspace = true
