[package]
name = "kmuxd"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "kmux server daemon hosting persistent terminal sessions."
build = "build.rs"

[[bin]]
name = "kmuxd"
path = "src/main.rs"

[features]
# Daemon federation (issue #121): the local kmuxd opens an upstream connection
# to a remote kmuxd and proxies its sessions to local GUIs. Default-on for the
# daemon (it always wants the capability); gated so the federation subsystem and
# its `kmux-connect` dependency can be compiled out (`--no-default-features`),
# which also keeps the upstream-connect machinery off any build that doesn't
# need it. See docs/architecture-federation.md.
default = ["federation"]
# `kmux-connect/remote` re-enables the upstream transport stack (the workspace
# builds the client crates lean by default for the GUIs); the daemon federates
# to remote daemons over TCP+TLS and SSH, so it needs the full stack.
federation = ["dep:kmux-connect", "kmux-connect/remote", "dep:kmux-client"]

[dependencies]
kmux-pty.workspace = true
kmux-protocol = { workspace = true, features = ["framing", "tls", "quic", "tcp-tls", "uds"] }
# Outbound peer links (the "server is also a client" role). Only pulled in with
# the `federation` feature; `kmux-connect` depends solely on `kmux-protocol`, so
# this adds no dependency cycle.
kmux-connect = { workspace = true, optional = true }
# Federation reuses the client-side `CellGrid` as the proxied-pane mirror (apply
# upstream snapshots/diffs, mint a snapshot for a late local attacher via
# `to_snapshot()`). `kmux-client` depends on `kmux-protocol`, never on `kmuxd`, so
# no cycle. Also a dev-dependency (handoff_e2e); harmless overlap.
kmux-client = { workspace = true, optional = true }
daemonize.workspace = true
nix.workspace = true
serde.workspace = true
serde_json.workspace = true
kmux-ghostty.workspace = true
# Direct dep (rather than only transitive via kmux-ghostty) so this crate's
# build.rs receives `DEP_KMUX_GHOSTTY_LIB_DIR` and can embed the rpath.
kmux-ghostty-sys.workspace = true
tokio.workspace = true
quinn.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
rcgen.workspace = true
rand.workspace = true
clap.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
postcard.workspace = true
# Cross-platform process stats (CPU/memory) for the process overview (issue
# #122). Used to sample each pane's process tree. `default-features = false`
# drops the disk/network/component probes we never query.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile.workspace = true
# Used only by tests/handoff_e2e.rs to drive a real daemon's control + data
# sockets across a graceful restart. kmux-client depends on kmux-protocol (never
# on kmuxd), so this introduces no dependency cycle.
kmux-client.workspace = true
