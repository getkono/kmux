[package]
name = "kmux-protocol"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Versioned wire protocol shared between kmux and kmuxd."

[features]
default = ["framing"]
framing = ["dep:tokio"]
# TLS helpers (rustls, rcgen, TOFU store). Pulled in by quic and tcp-tls.
tls = [
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:rustls-native-certs",
    "dep:rcgen",
    "dep:sha2",
    "dep:toml",
]
# QUIC transport.
quic = ["tls", "dep:quinn"]
# TCP+TLS transport.
tcp-tls = ["tls", "dep:tokio-rustls", "dep:tokio"]
# Unix domain socket transport.
uds = ["dep:tokio"]
# Gate ClientTransport impls (client-side only builds).
client = []
# Gate Listener impls (server-side only builds).
server = []

[dependencies]
anyhow.workspace = true
bitflags = { workspace = true, features = ["serde"] }
nix = { workspace = true, features = ["net", "user"] }
tokio-rustls = { workspace = true, optional = true }
serde.workspace = true
postcard.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, optional = true }
quinn = { workspace = true, optional = true }
# tls feature deps
rustls = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }
rustls-native-certs = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
toml = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
