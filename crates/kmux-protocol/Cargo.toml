[package]
name = "kmux-protocol"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Versioned wire protocol shared between kmux and kmuxd: message types, codec, and compatibility classification. Pure data — see kmux-sys for paths, identity, TLS and transports."

[features]
default = ["framing"]
# Length-prefixed async framing + per-frame zstd compression of the wire codec.
framing = ["dep:tokio", "dep:zstd"]

[dependencies]
bitflags = { workspace = true, features = ["serde"] }
serde.workspace = true
rmp-serde.workspace = true
serde_bytes.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }

[dev-dependencies]
# Used by the `compression_bench` example to sweep zstd levels offline.
zstd.workspace = true
# Round-trip tests for the JSON control/handoff protocol (control_rpc.rs).
serde_json.workspace = true

[lints]
workspace = true

# serde_bytes is used through `#[serde(with = "serde_bytes")]` -- a string
# literal in an attribute, not a `use`, so cargo-machete cannot see it. Dropping
# it would silently re-encode every byte-slice field as an array of integers,
# which is a wire-format change.
[package.metadata.cargo-machete]
ignored = ["serde_bytes"]
