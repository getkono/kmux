[package]
name = "kmux-gtk"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "GTK4 native GUI frontend for the kmux client (Linux)."

# The GUI is the primary `kmux` command on Linux. The terminal frontend ships
# as the separate `kmux-tui` binary.
[[bin]]
name = "kmux"
path = "src/main.rs"

[dependencies]
kmux-app.workspace = true
kmux-client.workspace = true
kmux-protocol = { workspace = true, features = ["framing"] }
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
futures.workspace = true
gtk4 = "0.9"
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
pangocairo = "0.20"
