[package]
name = "kmux-gtk"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "GTK4 native GUI frontend for the kmux client (Linux)."

# The GTK frontend ships as its own `kmux-gtk` binary: the default + official
# client on Linux, also runnable on macOS. The unified `kmux` entrypoint (the
# `kmux` crate) execs it.
[[bin]]
name = "kmux-gtk"
path = "src/main.rs"

[features]
# GPU terminal rendering via the shared kmux-render crate (wgpu). On by default
# (issue #132) so the GPU path is always compiled; the renderer still stays
# Cairo unless `renderer = "gpu"` in config.toml selects it at runtime. Build
# `--no-default-features` for a lean, Cairo-only binary that pulls no wgpu. CI
# compiles both. See docs/architecture-render.md.
default = ["gpu"]
gpu = ["kmux-render/gpu"]

[dependencies]
kmux-app.workspace = true
kmux-client.workspace = true
kmux-protocol = { workspace = true, features = ["framing"] }
# The wgpu-free core (geometry/cursor_geometry/CellMetrics) is always linked so
# the render-debug overlay can report what the renderer computes even on the
# Cairo path; the `gpu` feature layers on wgpu (`kmux-render/gpu`).
kmux-render.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
futures.workspace = true

# The GTK4 + libadwaita stack is the desktop frontend on Linux (system packages)
# and macOS (Homebrew: `brew install gtk4 libadwaita`). Gating the deps to those
# two targets keeps the crate buildable on other OSes, where `src/main.rs`
# compiles to a tiny stub binary.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
gtk4.workspace = true
adw.workspace = true
pangocairo.workspace = true
# Register the bundled symbol fallback font with fontconfig at startup so Pango's
# automatic font fallback resolves Powerline/Nerd glyphs on the Cairo path (issue
# #145). fontconfig is always present wherever GTK builds (pango links it).
fontconfig-sys.workspace = true
