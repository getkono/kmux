[package]
name = "kmux-gtk"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "GTK4 native GUI frontend for the kmux client (Linux)."

# The GTK frontend ships as its own `kmux-gtk` binary: the default + official
# client on Linux, also runnable on macOS. The unified `kmux` entrypoint (the
# `kmux` crate) execs it.
[[bin]]
name = "kmux-gtk"
path = "src/main.rs"

[features]
# Opt-in GPU terminal rendering via the shared kmux-render crate (wgpu). Off by
# default so the standard build stays Cairo-only and pulls no wgpu; selected at
# runtime with KMUX_RENDERER=wgpu. See docs/architecture-render.md.
gpu = ["dep:kmux-render"]

[dependencies]
kmux-app.workspace = true
kmux-client.workspace = true
kmux-protocol = { workspace = true, features = ["framing"] }
kmux-render = { workspace = true, optional = true, features = ["gpu"] }
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
futures.workspace = true

# The GTK4 + libadwaita stack is the desktop frontend on Linux (system packages)
# and macOS (Homebrew: `brew install gtk4 libadwaita`). Gating the deps to those
# two targets keeps the crate buildable on other OSes, where `src/main.rs`
# compiles to a tiny stub binary.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
gtk4 = "0.9"
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
pangocairo = "0.20"
