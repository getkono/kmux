[package]
name = "kmux-client"
version = "0.1.0"
edition = "2024"

[dependencies]
kmux-protocol = { path = "../kmux-protocol", features = ["framing"] }
tokio = { version = "1", features = ["full"] }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-native-certs = "0.8"
tracing = "0.1"
bitflags = "2"
