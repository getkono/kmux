[package]
name = "kmux-client"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Client library for connecting to a kmuxd server."

[features]
default = ["remote"]
# Forward the remote-transport stack (QUIC/TCP+TLS/SSH) down to kmux-connect and
# pull in the kmux-protocol TLS helpers it needs. Default-on for standalone
# builds/tests; the workspace disables it so GUI frontends stay lean (issue #121).
remote = ["kmux-connect/remote", "kmux-protocol/tls", "kmux-protocol/tcp-tls"]

[dependencies]
kmux-protocol = { workspace = true, features = ["framing", "uds"] }
kmux-connect = { workspace = true }
arc-swap.workspace = true
rand.workspace = true
nix.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
bitflags.workspace = true

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
