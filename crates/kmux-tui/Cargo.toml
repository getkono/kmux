[package]
name = "kmux-tui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Terminal (TUI) frontend for the kmux client."
build = "build.rs"

# NOTE: the binary is still named `kmux` during the TUI→GUI migration so the
# justfile daemon targets and existing workflows keep working. P7 introduces the
# `kmux` launcher crate and renames this bin to `kmux-tui`.
[[bin]]
name = "kmux"
path = "src/main.rs"

[dependencies]
kmux-app.workspace = true
kmux-client.workspace = true
kmux-protocol = { workspace = true, features = ["framing"] }
anyhow.workspace = true
clap.workspace = true
arboard.workspace = true
crossterm.workspace = true
ratatui.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tabled.workspace = true

[dev-dependencies]
tempfile.workspace = true
