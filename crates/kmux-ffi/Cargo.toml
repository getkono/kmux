[package]
name = "kmux-ffi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "uniffi bindings exposing kmux_app::FrontendDriver to non-Rust frontends (e.g. the SwiftUI macOS app)."

[lib]
# `cdylib`/`staticlib` for linking into the Swift app; `lib` so the
# uniffi-bindgen binary (library mode) can introspect the crate.
crate-type = ["lib", "staticlib", "cdylib"]

# Swift bindings are generated from the built cdylib in library mode:
#   cargo build -p kmux-ffi
#   cargo run  -p kmux-ffi --bin uniffi-bindgen -- \
#     generate --library target/debug/libkmux_ffi.dylib --language swift \
#     --out-dir <out>
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[features]
# GPU terminal rendering via kmux-render (wgpu), exposed to Swift as the
# KmuxRenderer object. On by default (issue #132) so the GPU path is always
# compiled and covered by the standard build/test paths; the runtime still
# stays CPU unless `renderer = "gpu"` in config.toml selects it. Build `--no-default-features`
# for a lean, wgpu-free staticlib — the packed-cell format is always available
# regardless. CI compiles both. See docs/architecture-render.md.
default = ["gpu"]
gpu = ["kmux-render/gpu"]

[dependencies]
kmux-app.workspace = true
kmux-client.workspace = true
kmux-protocol = { workspace = true, features = ["framing"] }
# Default (wgpu-free) for the shared packed-cell format; the `gpu` feature turns
# on the wgpu renderer for the KmuxRenderer object.
kmux-render.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
# `cli` provides `uniffi_bindgen_main` for the `uniffi-bindgen` binary above.
uniffi = { workspace = true, features = ["cli"] }
