[package]
name = "kmux-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Frontend-agnostic interaction layer for the kmux client, shared by the GUI frontends."
# Captures build metadata (git SHA, date, profile) for the CLI --version string.
build = "build.rs"

[features]
default = ["remote"]
# Forward the remote-transport stack to kmux-client. Gates the SSH supervisor
# launch + the `--test` transport-probing diagnostic, which only make sense when
# the GUI dials remotes directly. Default-on for standalone builds/tests; the
# workspace disables it so GUI frontends stay lean (issue #121).
remote = ["kmux-client/remote"]

[dependencies]
kmux-client.workspace = true
kmux-protocol = { workspace = true, features = ["framing", "identity"] }
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
clap_complete.workspace = true
tabled.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
log.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
