[package]
name = "smux-protocol"
version = "0.1.0"
edition = "2024"

[features]
framing = ["dep:tokio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt"], optional = true }
