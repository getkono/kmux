[package]
name = "kmux-vt-worker"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Isolated per-pane VT worker: adopts a PTY master fd and runs the libghostty-vt pipeline out-of-process so a terminal crash cannot take down kmuxd (issue #126)."
build = "build.rs"

[[bin]]
name = "kmux-vt-worker"
path = "src/main.rs"

[dependencies]
# The shared VT pipeline -- the SAME backend/diff-engine code kmuxd runs
# in-process, so diffs are identical across the boundary by construction.
kmux-vt-core.workspace = true
# Daemon<->worker IPC contract + framing codec.
kmux-worker-protocol.workspace = true
# Wire payload types (TermSize, CellState, …) and BackendSize conversions.
kmux-protocol.workspace = true
# PTY fd adoption (`from_inherited`), reader/writer split, resize.
kmux-pty.workspace = true
# Direct dep (rather than only transitive via kmux-vt-core -> kmux-ghostty) so
# this binary's build.rs receives `DEP_KMUX_GHOSTTY_LIB_DIR` and can embed the
# libkmux_ghostty rpath, exactly like kmuxd.
kmux-ghostty-sys.workspace = true
tokio.workspace = true
nix.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true

[lints]
workspace = true
