[package]
name = "smux-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "smux-server"
path = "src/main.rs"

[dependencies]
smux = { path = "../smux" }
nix = { version = "0.31", features = ["process", "signal"] }
smux-protocol = { path = "../smux-protocol" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
rcgen = "0.13"
rand = "0.9"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
futures-util = "0.3"
