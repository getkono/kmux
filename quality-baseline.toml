# The quality baseline: a budget that may only shrink.
#
# Every row records how many violations of a lint one crate still has. CI runs
# `mise run lint-gate`, which fails when a count goes UP (a regression) and also
# when a count goes DOWN without this file being updated, because a stale budget
# is slack a later regression can hide in. Tighten it with `mise run baseline`,
# which rewrites the measured tables from what was just measured; loosening is
# always a manual edit here, visible in review. That asymmetry is the design.
#
# `mise run baseline` regenerates only the tables below. Everything down to the
# first one -- these comments and the whole meta block, comments included -- is
# hand-written policy and is carried through verbatim, apart from the toolchain
# stamp.
#
# Deliberately NOT ratcheted: clippy::str_to_string, 715 sites. It fires on
# `.to_string()` for a &str, which is idiomatic and reads better than the
# `.to_owned()` it asks for; a 715-row budget would be noise standing in front
# of signal.
#
# See docs/quality-gates.md.

[meta]
# Recorded so a toolchain upgrade cannot masquerade as a regression -- or, worse,
# absorb one by changing what a lint fires on in the same commit that changes
# the code. `mise run baseline` restamps it.
rustc = "1.96.0"

# The lints the gate injects with `--force-warn`, which outranks both
# `-D warnings` (so these stay warnings and get counted instead of failing the
# compile) and any in-source `#[allow]` (so a budget cannot be paid down by
# suppressing rather than fixing). Grouped by what they are for, because a flat
# list of 23 lint names tells the next person nothing about which ones matter.
#
# A lint that reaches zero everywhere moves out of this list and into
# [workspace.lints] in the root Cargo.toml, where the compiler holds it at zero
# for free. That migration is the point of the exercise.
ratcheted = [
    # Documentation. missing_docs is the bulk of the debt and the most
    # mechanical part of it.
    "missing_docs",
    "missing_debug_implementations",
    "clippy::missing_errors_doc",
    "clippy::missing_panics_doc",

    # Panics on production paths. A daemon that unwraps takes a user's session
    # with it. clippy.toml exempts test code, where a panic IS the failure
    # report -- see docs/testing.md R1.
    "clippy::unwrap_used",
    "clippy::expect_used",
    "clippy::panic",
    "clippy::unwrap_in_result",

    # Numeric conversions. This workspace hand-rolls a wire format and a C ABI,
    # so a silent truncation is a protocol bug, not a rounding error.
    "clippy::cast_possible_truncation",
    "clippy::cast_possible_wrap",
    "clippy::cast_precision_loss",
    "clippy::cast_sign_loss",

    # Size and shape. too_many_lines is the executable form of docs/testing.md
    # R4, and the one with the most leverage: a body-replacement mutant is
    # generated per FUNCTION, so a 900-line dispatcher yields exactly one mutant
    # covering 50 message types. Function size is a hard cap on how much
    # resolution the mutation score can ever have.
    "clippy::too_many_lines",
    "clippy::cognitive_complexity",
    "clippy::struct_excessive_bools",
    "clippy::items_after_statements",
    "clippy::match_same_arms",
    "clippy::single_match_else",
    "clippy::needless_continue",

    # Ownership and locking.
    "clippy::needless_pass_by_value",
    "clippy::redundant_clone",
    "clippy::significant_drop_tightening",
    "clippy::string_slice",
]
