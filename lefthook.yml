pre-commit:
  piped: true
  commands:
    format-fix:
      priority: 1
      run: cargo fmt --all
    lint-fix:
      priority: 2
      run: cargo clippy --workspace --fix --allow-dirty --allow-staged
    check-modified:
      priority: 3
      run: git diff --exit-code || { echo "Auto-fixes were applied. Stage the changes and re-commit."; exit 1; }

pre-push:
  commands:
    format-check:
      run: cargo fmt --check --all
    lint-check:
      run: cargo clippy --workspace -- -D warnings
    test:
      run: cargo test --workspace
