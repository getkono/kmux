pre-commit:
  commands:
    format-fix:
      run: cargo fmt --all
    lint-fix:
      run: cargo clippy --workspace --fix --allow-dirty --allow-staged

pre-push:
  commands:
    format-check:
      run: cargo fmt --check --all
    lint-check:
      run: cargo clippy --workspace -- -D warnings
    test:
      run: cargo test --workspace
