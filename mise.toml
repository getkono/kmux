[tools]
# Pinned to ghostty v1.3.1's minimum_zig_version (build.zig.zon).
zig = "0.15.2"
# Pinned to an exact release (not floating "stable") for reproducible rustc +
# rustfmt; mirrors rust-toolchain.toml. Bump deliberately. `profile = "default"`
# pulls rustfmt + clippy from rustup's component set instead of leaning on
# rust-toolchain.toml's `components`: that path re-resolved `rustfmt` to the
# legacy `rustfmt-preview` component on a fresh in-repo `cargo install` and
# collided with the already-present `cargo-fmt` ("detected conflict:
# 'bin/cargo-fmt'"), which broke `mise install` (cargo-mutants/convco) in CI.
rust = { version = "1.96.0", profile = "default" }
# `mise run release` regenerates CHANGELOG.md from conventional commits via
# git-cliff, and the release workflow shells out to `mise run package`. Pinning
# both here means local dev and CI runners resolve identical versions.
"aqua:orhun/git-cliff" = "2.13.1"
# Git hooks (pre-commit/pre-push); config in hk.pkl. hk uses its built-in pkl
# evaluator, so no separate `pkl` CLI is needed. The `postinstall` hook below
# wires it into .git/hooks after `mise install` (or run `mise run setup`).
hk = "1.48.0"
# Mutation testing (`mise run mutants`). Pinned so local and CI sweeps mutate
# against an identical cargo-mutants version.
"cargo:cargo-mutants" = "27.1.0"
# Line-count reporting (`mise run loc`). aqua backend ships prebuilt binaries
# (like git-cliff above), so no source build. Pinned for stable counts.
"aqua:XAMPPRocky/tokei" = "12.1.2"
# Conventional-commit linting (issue #130): the hk commit-msg/pre-push hooks and
# the CI commit-lint job all run `convco check` via the `commit-msg-check` /
# `commit-check` mise-tasks. Built from source — convco ships no arch-tagged
# prebuilt we can pin against — but it pins git2 with default-features=false, so
# it vendors libgit2 with no openssl/system deps (just a C compiler); mise caches
# the compiled binary like cargo-mutants above.
"cargo:convco" = "0.6.4"
"aqua:EmbarkStudios/cargo-deny" = "0.18.5"
"cargo:cargo-machete" = "0.9.1"

[settings]
# Required for the `[hooks]` block below (mise gates hooks behind this flag).
experimental = true

[hooks]
# After `mise install`, bootstrap the checkout: initialise the vendored ghostty
# submodule and install hk's git hooks into .git/hooks. Both steps are idempotent
# (cheap no-ops once set up). The per-step `|| true` keeps a fresh checkout from
# failing the install when the network is unavailable on the very first run (the
# submodule fetch and hk's pkl-schema fetch both need it) — rerun `mise run setup`
# once online. This best-effort path can't mask a broken checkout: the build still
# hard-fails later if vendor/ghostty is missing (kmux-ghostty-sys build.rs).
postinstall = """
git submodule update --init --recursive || true
hk install || true
"""

# ── Tasks ─────────────────────────────────────────────────────────────────────
# `mise run <task>` replaces the old `just <task>`. mise activates the pinned
# toolchain (incl. zig 0.15.2) for every task, so cargo builds resolve the right
# zig via PATH automatically (build.rs honors $ZIG, else falls back to PATH zig).
# One-liners live here; the multi-step recipes are scripts under mise-tasks/.

[tasks.fmt]
description = "Format all code"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check formatting (CI mode)"
run = "cargo fmt --all -- --check"

[tasks.clippy]
description = "Run clippy lints"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.clippy-fix]
description = "Auto-fix clippy lints"
run = "cargo clippy --fix --allow-dirty --allow-staged --workspace --all-targets -- -D warnings"

[tasks.build]
description = "Build (default features — includes the GPU renderer, issue #132)"
run = "cargo build"

[tasks.build-no-gpu]
description = "Build the GUI crates without the GPU renderer (must stay wgpu-free)"
# `gpu` is a default feature (issue #132), so the standard build/test paths
# always exercise it. This proves the lean path still compiles, so the CPU
# renderers (GTK Cairo, the wgpu-free packed-cell format) can never bit-rot.
# Mirrors the CI "Build without GPU" step — kmux-gtk falls back to its
# target-gated Cairo path; kmux-ffi keeps only the packed-cell format.
run = "cargo build -p kmux-gtk -p kmux-ffi --no-default-features"

[tasks.test]
description = "Run tests (whole workspace; matches CI)"
run = "cargo test --workspace"

# The SwiftPM build tree (kmux-swift/.build) is separate from cargo's target/ and
# nothing else prunes it, so it grows unbounded (debug + release + module cache +
# editor index-build). `clean-swift` reclaims just that; `clean` is the full reset.
[tasks.clean-swift]
description = "Remove the SwiftPM build tree (kmux-swift/.build)"
run = "rm -rf kmux-swift/.build"

[tasks.clean]
description = "Remove all build artifacts (cargo target/ + SwiftPM .build)"
depends = ["clean-swift"]
run = "cargo clean"

[tasks.swift-test]
description = "Test the native macOS app (kmux-swift). Regenerates bindings first."
depends = ["gen-ffi-bindings"]
run = "swift test --package-path kmux-swift"

[tasks.doc]
description = "Generate docs"
run = "cargo doc --no-deps --open"

[tasks.doc-check]
description = "Check docs build (no open)"
run = "cargo doc --no-deps --all-features"

[tasks.doc-test]
description = "Run doc tests"
run = "cargo test --doc --all-features"

[tasks.loc]
description = "Count lines of our own code + docs (tokei)"
# Reports the code/docs we actually wrote. tokei already honors .gitignore (so
# target/ and the generated swift bindings drop out); we additionally exclude
# the ghostty submodule (vendored library) and crates/kmuxd/src/eff_long_wordlist.txt
# (the EFF diceware wordlist — third-party data, not code we maintain).
run = "tokei --exclude vendor --exclude crates/kmuxd/src/eff_long_wordlist.txt"

# tail-client-log / tail-daemon-log live in mise-tasks/ — they tail BOTH the
# release (kmux/) and debug (kmux-debug/) logs so a `cargo run` dev build's
# output is visible (debug builds isolate their state under kmux-debug/).

[tasks.setup]
description = "Initialize the ghostty submodule + install hk's git hooks (fallback for the postinstall hook)"
# Same two steps as the postinstall hook, but strict: when invoked explicitly,
# fail loudly so a setup problem isn't silently swallowed. mise runs the array
# sequentially and aborts on the first non-zero exit.
run = [
  "git submodule update --init --recursive",
  "hk install",
]

[tasks.lint-flags]
description = "Print the --force-warn flags for the ratcheted lints (used by lint-gate)"
run = "cargo run -q -p xtask -- lint-flags"

[tasks.deps-audit]
description = "Third-party dependency hygiene: licenses + advisories (cargo-deny) and unused deps (cargo-machete)"
# cargo-deny covers what the dual AGPL/commercial license makes a commercial
# requirement (third-party license compatibility) and what nothing checked
# before (RUSTSEC advisories against a rustls/ring/quinn tree). cargo-machete
# replaces the name-grep audit docs/crate-usage.md itself admits "is a name
# check, not a compiler check".
run = [
  "cargo deny check",
  "cargo machete --with-metadata",
]
