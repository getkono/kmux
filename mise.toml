[tools]
# Pinned to ghostty v1.3.1's minimum_zig_version (build.zig.zon).
zig = "0.15.2"
# Pinned to an exact release (not floating "stable") for reproducible rustc +
# rustfmt; mirrors rust-toolchain.toml. Bump deliberately.
rust = "1.96.0"
# `mise run release` regenerates CHANGELOG.md from conventional commits via
# git-cliff, and the release workflow shells out to `mise run package`. Pinning
# both here means local dev and CI runners resolve identical versions.
"aqua:orhun/git-cliff" = "2.13.1"
# Git hooks (pre-commit/pre-push); config in hk.pkl. hk uses its built-in pkl
# evaluator, so no separate `pkl` CLI is needed. The `postinstall` hook below
# wires it into .git/hooks after `mise install` (or run `mise run setup`).
hk = "1.48.0"
# Mutation testing (`mise run mutants`). Pinned so local and CI sweeps mutate
# against an identical cargo-mutants version.
"cargo:cargo-mutants" = "27.1.0"
# Line-count reporting (`mise run loc`). aqua backend ships prebuilt binaries
# (like git-cliff above), so no source build. Pinned for stable counts.
"aqua:XAMPPRocky/tokei" = "12.1.2"

[settings]
# Required for the `[hooks]` block below (mise gates hooks behind this flag).
experimental = true

[hooks]
# After `mise install`, install hk's git hooks into .git/hooks (idempotent). The
# `|| true` keeps a fresh checkout from failing the install if hk can't reach the
# network to fetch its pkl schema on the very first run — rerun `mise run setup`.
postinstall = "hk install || true"

# ── Tasks ─────────────────────────────────────────────────────────────────────
# `mise run <task>` replaces the old `just <task>`. mise activates the pinned
# toolchain (incl. zig 0.15.2) for every task, so cargo builds resolve the right
# zig via PATH automatically (build.rs honors $ZIG, else falls back to PATH zig).
# One-liners live here; the multi-step recipes are scripts under mise-tasks/.

[tasks.fmt]
description = "Format all code"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check formatting (CI mode)"
run = "cargo fmt --all -- --check"

[tasks.clippy]
description = "Run clippy lints"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.clippy-fix]
description = "Auto-fix clippy lints"
run = "cargo clippy --fix --allow-dirty --allow-staged --workspace --all-targets -- -D warnings"

[tasks.build]
description = "Build (default features — includes the GPU renderer, issue #132)"
run = "cargo build"

[tasks.build-no-gpu]
description = "Build the GUI crates without the GPU renderer (must stay wgpu-free)"
# `gpu` is a default feature (issue #132), so the standard build/test paths
# always exercise it. This proves the lean path still compiles, so the CPU
# renderers (GTK Cairo, the wgpu-free packed-cell format) can never bit-rot.
# Mirrors the CI "Build without GPU" step — kmux-gtk falls back to its
# target-gated Cairo path; kmux-ffi keeps only the packed-cell format.
run = "cargo build -p kmux-gtk -p kmux-ffi --no-default-features"

[tasks.test]
description = "Run tests (whole workspace; matches CI)"
run = "cargo test --workspace"

[tasks.gtk-app]
description = "Build the GTK app (kmux-gtk)"
run = "cargo build -p kmux-gtk"

[tasks.gtk-run]
description = "Run the GTK app (kmux-gtk) against the debug daemon"
# Build + pin the debug kmuxd so the GUI auto-spawns it, not an installed
# release kmuxd on PATH (which a debug client can never reach — separate runtime
# dirs). See find_server_binary() / KMUX_KMUXD in crates/kmux-connect.
run = [
    "cargo build -p kmuxd",
    'KMUX_KMUXD="$PWD/target/debug/kmuxd" cargo run -p kmux-gtk',
]

[tasks.gtk-test]
description = "Test the GTK app (kmux-gtk)"
run = "cargo test -p kmux-gtk"

[tasks.swift-app]
description = "Build the native macOS app (kmux-swift). Regenerates bindings first."
depends = ["gen-ffi-bindings"]
run = "swift build --package-path kmux-swift"

[tasks.swift-run]
description = "Run the native macOS app (kmux-swift) against the debug daemon. Regenerates bindings first."
depends = ["gen-ffi-bindings"]
# Build + pin the debug kmuxd (see gtk-run); the app inherits KMUX_KMUXD from
# `swift run` and auto-spawns target/debug/kmuxd instead of a release one on PATH.
run = [
    "cargo build -p kmuxd",
    'KMUX_KMUXD="$PWD/target/debug/kmuxd" swift run --package-path kmux-swift',
]

[tasks.swift-test]
description = "Test the native macOS app (kmux-swift). Regenerates bindings first."
depends = ["gen-ffi-bindings"]
run = "swift test --package-path kmux-swift"

# The Rust `gpu` feature is on by default now, so the bindings always include
# KmuxRenderer; these tasks add the Swift `-DKMUX_GPU` flag (compiles the Metal
# view) and, for `-run`, select the GPU path via a fixture `config.toml`
# (`renderer = "gpu"`) — the runtime knob is config now, not an env var.
[tasks.swift-gpu-app]
description = "Build the macOS app with the Swift Metal view compiled in (issue #132)."
run = [
    "mise run gen-ffi-bindings",
    "swift build --package-path kmux-swift -Xswiftc -DKMUX_GPU",
]

[tasks.swift-gpu-run]
description = "Run the macOS app on the GPU renderer (renderer = \"gpu\" via a fixture config)."
# Build + pin the debug kmuxd (see gtk-run) so the GPU dev app auto-spawns it.
# A fixture XDG_CONFIG_HOME carries `renderer = "gpu"` since the renderer is now
# a config key rather than an env var.
run = [
    "mise run gen-ffi-bindings",
    "cargo build -p kmuxd",
    "mkdir -p target/gpu-config/kmux && printf 'renderer = \"gpu\"\\n' > target/gpu-config/kmux/config.toml",
    'XDG_CONFIG_HOME="$PWD/target/gpu-config" KMUX_KMUXD="$PWD/target/debug/kmuxd" swift run --package-path kmux-swift -Xswiftc -DKMUX_GPU',
]

[tasks.doc]
description = "Generate docs"
run = "cargo doc --no-deps --open"

[tasks.doc-check]
description = "Check docs build (no open)"
run = "cargo doc --no-deps --all-features"

[tasks.doc-test]
description = "Run doc tests"
run = "cargo test --doc --all-features"

[tasks.loc]
description = "Count lines of our own code + docs (tokei)"
# Reports the code/docs we actually wrote. tokei already honors .gitignore (so
# target/ and the generated swift bindings drop out); we additionally exclude
# the ghostty submodule (vendored library) and crates/kmuxd/src/eff_long_wordlist.txt
# (the EFF diceware wordlist — third-party data, not code we maintain).
run = "tokei --exclude vendor --exclude crates/kmuxd/src/eff_long_wordlist.txt"

# tail-client-log / tail-daemon-log live in mise-tasks/ — they tail BOTH the
# release (kmux/) and debug (kmux-debug/) logs so a `cargo run` dev build's
# output is visible (debug builds isolate their state under kmux-debug/).

[tasks.setup]
description = "Install hk's git hooks (fallback for the postinstall hook)"
run = "hk install"
