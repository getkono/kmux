name: CLA

# Require external contributors to sign the kmux Contributor License Agreement
# (CLA.md) before their pull requests can be merged. kmux is dual-licensed
# (AGPL-3.0 OR commercial); the CLA's relicensing grant is what keeps the
# commercial option open. Signatures are stored in-repo, so only the built-in
# GITHUB_TOKEN is needed (no extra secret).
#
# Signatures live on the unprotected `cla-signatures` orphan branch, not on
# `master`. The "Protect master" ruleset covers ~DEFAULT_BRANCH and requires
# every change to arrive through a pull request — something GITHUB_TOKEN cannot
# satisfy. Storing them on `master` therefore failed with "Repository rule
# violations found", so no signature was ever recorded and contributors were
# asked to sign again on every PR. Keep `cla-signatures` out of every ruleset,
# or signing silently regresses the same way.

on:
  # pull_request_target runs in the context of the base repo, so the signature
  # store is writable even for PRs from forks.
  pull_request_target:
    types: [opened, synchronize, closed]
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA assistant
    runs-on: ubuntu-latest
    # Only run on the sign-off comment or on PR events (ignore unrelated comments).
    if: >-
      (github.event.issue.pull_request && contains(github.event.comment.body, 'I hereby sign the CLA'))
      || github.event_name == 'pull_request_target'
    steps:
      - name: CLA assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/getkono/kmux/blob/master/CLA.md'
          # Seeded on the signature branch; the action appends to it as people
          # sign. Keyed by numeric GitHub user id, so a signature survives a
          # username change. Do not edit by hand.
          path-to-signatures: 'signatures/version1/cla.json'
          # Unprotected on purpose — see the note at the top of this file.
          branch: 'cla-signatures'
          # Bots and maintainers who hold copyright do not need to sign.
          # Add maintainer GitHub usernames here as the team grows.
          allowlist: 'dependabot[bot],*[bot]'
