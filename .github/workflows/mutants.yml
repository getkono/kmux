name: Mutation sweep

# The full sweep. Weekly rather than per-PR because it mutates ~5,000 functions
# and each one rebuilds and re-runs a test binary; per-PR coverage comes from the
# `--in-diff` job in ci.yml, whose cost tracks the size of the change.
#
# This is the only thing that fills in the `[[mutants]]` table in
# quality-baseline.toml. It does not write it — a sweep proposes, a human commits
# — but it uploads the outcomes and prints what the budgets would become.
on:
  schedule:
    # 04:00 UTC on Sundays: after the week's merges, before anyone reads it.
    - cron: "0 4 * * 0"
  # Takes no inputs: the shard count is the fixed matrix below (8), and an
  # input that did not reach the matrix or `--shard` only looked like a knob.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    name: Sweep ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      # One failing shard must not cancel the rest. A shard fails only when it
      # did not measure everything it was given (a crate group that did not
      # run, or the timeout) -- surviving mutants still exit 0 -- and the
      # `judge` job below refuses the sweep then; the others finishing says
      # what they found. The verdict comes from the gate over the merged
      # outcomes.
      fail-fast: false
      matrix:
        # cargo-mutants numbers shards from 0: `--shard k/n` needs k < n.
        # These once ran 1-8, so shard 8 refused to start and shard 0 — an
        # eighth of the mutants — never ran, while the judge read the other
        # seven as the whole sweep.
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install system dependencies (GTK4 + libadwaita)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev

      - name: Install toolchains (mise)
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache zig build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            vendor/ghostty/.zig-cache
          key: ${{ runner.os }}-zig-${{ hashFiles('vendor/ghostty/build.zig', 'vendor/ghostty/build.zig.zon', 'crates/kmux-ghostty-sys/zig/**') }}
          restore-keys: |
            ${{ runner.os }}-zig-

      - name: Sweep
        run: mise run mutants -- --shard ${{ matrix.shard }}/8

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out/
          retention-days: 30

  judge:
    name: Judge the sweep
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchains (mise)
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - uses: actions/download-artifact@v4
        with:
          pattern: mutants-shard-*
          path: shards/

      # A shard that never ran uploads nothing, and one cut off by its timeout
      # uploads part of its share; either way seven shards merged look exactly
      # like a sweep of everything, with the missing mutants' survivors
      # uncounted and every budget too tight by them.
      - name: Every shard ran
        id: complete
        run: |
          if [ "${{ needs.sweep.result }}" != "success" ]; then
            echo "::error::a shard did not finish (${{ needs.sweep.result }}); a partial sweep is not judged"
            exit 1
          fi
          uploaded=$(find shards -mindepth 1 -maxdepth 1 -type d | wc -l)
          if [ "$uploaded" -ne 8 ]; then
            echo "::error::$uploaded of 8 shards uploaded results; a partial sweep is not judged"
            exit 1
          fi

      # Every shard directory, in one call: the gate merges them, so a package
      # split across shards is judged on its total rather than eight times on
      # eight partial views.
      - name: Believability check and budget comparison
        run: |
          dirs=$(find shards -name outcomes.json -printf '%h\n' | sort)
          echo "merging: $dirs"
          # shellcheck disable=SC2086
          cargo run -q -p xtask -- mutants-gate $dirs

      # The sweep proposes; a human commits. Printing the diff rather than
      # opening a PR keeps the budget a deliberate, reviewed edit — the same
      # rule the lint ratchet follows.
      - name: What the budgets would become
        if: always() && steps.complete.outcome == 'success'
        run: |
          dirs=$(find shards -name outcomes.json -printf '%h\n' | sort)
          # shellcheck disable=SC2086
          cargo run -q -p xtask -- mutants-gate --write $dirs || true
          git --no-pager diff -- quality-baseline.toml
