# git-cliff configuration for kmux.
#
# `just release <ver>` runs `git cliff --tag v<ver> -o CHANGELOG.md` to regenerate
# the changelog, and the release workflow runs `git cliff --latest` for the GitHub
# Release body. Both consume this file, so the committed CHANGELOG and the release
# notes always agree.
#
# See https://git-cliff.org/docs/configuration

[changelog]
# Rendered with Tera templates.
header = """
# Changelog

All notable changes to kmux are documented here.
The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}](https://github.com/getkono/kmux/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }} \
            ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/getkono/kmux/commit/{{ commit.id }}))\
    {% endfor %}
{% endfor %}\n
"""
footer = """
<!-- generated by git-cliff -->
"""
# Strip leading/trailing whitespace from the rendered template.
trim = true

[git]
# Parse messages as Conventional Commits (feat:, fix:, scoped variants like fix(kmuxd):).
conventional_commits = true
# Drop commits that don't match a `commit_parsers` rule (the repo is conventional;
# stray non-conventional commits should not pollute the changelog).
filter_commits = true
# Walk the commit graph so the "previous release" boundary is the nearest ANCESTOR
# tag, not the most-recently-dated tag. Required by issue #46: the last tagged
# version is the most recent parent tag in history.
topo_order = true
# Consider ALL tags regardless of name when computing the previous-tag range
# (issue #46: don't assume the last tag is semantic). We still create v-prefixed
# tags ourselves; this just avoids filtering them out by name.
tag_pattern = ".*"
# Newest commits first within each section.
sort_commits = "newest"
# Always surface breaking changes even if a parser would otherwise skip them.
protect_breaking_commits = true

# Tidy up messages before grouping.
commit_preprocessors = [
  # Turn bare issue/PR references (#123) into links.
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/getkono/kmux/issues/${1}))" },
]

# First matching rule wins. The `<!-- N -->` prefixes order the sections and are
# stripped from the rendered heading by `striptags` in the body template.
commit_parsers = [
  { message = "^[mM]erge (branch|pull request|remote-tracking)", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactor" },
  { message = "^docs?", group = "<!-- 4 -->Documentation" },
  { message = "^build", group = "<!-- 5 -->Build System" },
  { message = "^test", group = "<!-- 6 -->Testing" },
  # Everything else (chore, style, ci, non-conventional) is dropped by filter_commits.
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
